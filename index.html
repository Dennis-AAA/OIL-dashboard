<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球原油与成品油供求看板</title>
<style>
  :root {
    --text: #1a1d23; --text2: #565b66; --text3: #8a8f9c; --text4: #b3b8c4;
    --border: #e4e6eb; --accent: #2456d6; --up: #d43d3d; --down: #1a9e54;
    --warn: #b57d0a; --bg: #f7f8fa; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg); color: var(--text); letter-spacing: 0; padding: 28px 16px 48px;
  }
  .page { max-width: 1240px; margin: 0 auto; }
  .masthead {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 3px solid var(--text); padding-bottom: 12px;
  }
  h1 { font-size: 26px; font-weight: 700; }
  .masthead .asof { font-size: 13px; color: var(--text2); }
  .masthead .freq {
    margin-left: auto; font-size: 11px; color: var(--text3);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; background: var(--card);
  }
  .lede { margin-top: 8px; font-size: 13px; color: var(--text2); }

  .sig {
    display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.4;
    border-radius: 999px; padding: 3px 12px; cursor: help; white-space: nowrap;
  }
  .sig-bull  { color: #fff; background: var(--up); }
  .sig-bull2 { color: var(--up); background: rgba(212, 61, 61, .12); border: 1px solid rgba(212, 61, 61, .4); }
  .sig-neutral { color: var(--text2); background: #eef0f4; border: 1px solid var(--border); }
  .sig-bear2 { color: var(--down); background: rgba(26, 158, 84, .12); border: 1px solid rgba(26, 158, 84, .4); }
  .sig-bear  { color: #fff; background: var(--down); }

  .brief {
    margin-top: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; border-left: 4px solid var(--accent); padding: 13px 18px 14px;
  }
  .brief h2 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .brief ul { list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px 26px; }
  .brief li {
    font-size: 12.5px; line-height: 1.6; color: var(--text2);
    padding-left: 12px; position: relative;
  }
  .brief li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .brief li b { color: var(--text); font-weight: 650; margin-right: 4px; }
  @media (max-width: 680px) { .brief ul { grid-template-columns: 1fr; } }
  @media print { .brief { break-inside: avoid; } }

  .hero { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
  .hero-card, .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 12px;
  }
  .hero-card { border-top: 3px solid var(--accent); }
  .lbl { font-size: 12.5px; color: var(--text2); }
  .hero-card output { display: inline-block; font-size: 32px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 3px; }
  .hero-card output .unit { font-size: 12px; font-weight: 400; color: var(--text3); margin-left: 4px; }
  .meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 3px; }
  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px;
    font-variant-numeric: tabular-nums; color: var(--text2); background: #eef0f4;
  }
  .chip.up { color: var(--up); background: rgba(212, 61, 61, .10); }
  .chip.down { color: var(--down); background: rgba(26, 158, 84, .10); }
  .date { font-size: 11px; color: var(--text4); }
  .range { font-size: 10.5px; color: var(--text4); font-variant-numeric: tabular-nums; }

  section { margin-top: 26px; }
  section h2 {
    font-size: 14px; font-weight: 650; color: var(--text);
    display: flex; align-items: baseline; gap: 10px;
    background: #eef2f9; border-radius: 6px; padding: 6px 12px; margin-bottom: 12px;
  }
  section h2 .src {
    font-size: 10.5px; font-weight: 400; color: var(--text3);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; background: var(--card);
  }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); }
  .cards.n1 { grid-template-columns: repeat(2, 1fr); }
  .cards.wide { grid-template-columns: 1fr; }
  .cot-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11.5px; color: var(--text3); margin: 10px 0 2px; }
  .cot-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .cot-leg b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .chart .zero { stroke: var(--text3); stroke-width: 1; opacity: .7; }
  .cards.n2 { grid-template-columns: repeat(2, 1fr); }
  .cards.big { grid-template-columns: repeat(2, 1fr); }
  .card output { display: inline-block; font-size: 22px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card output .unit { font-size: 11px; font-weight: 400; color: var(--text3); margin-left: 3px; }

  .chart { position: relative; margin-top: 10px; }
  .chart svg { display: block; width: 100%; height: 100%; }
  .chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
  .ga0 { stop-color: var(--accent); stop-opacity: .20; }
  .ga1 { stop-color: var(--accent); stop-opacity: .02; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.thin { stroke-width: 0.95; }
  .chart .avg { stroke: var(--text4); stroke-width: 1; stroke-dasharray: 4 3; opacity: .8; }
  .chart .ext { fill: #fff; stroke: var(--text3); stroke-width: 1.2; }
  .chart .dot { fill: var(--accent); stroke: #fff; stroke-width: 1.5; }
  .c-lab {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 10px; line-height: 1.25; font-variant-numeric: tabular-nums;
    color: var(--text3); white-space: nowrap; pointer-events: none;
  }
  .c-lab.last { color: var(--accent); font-weight: 700; font-size: 11px; }
  .c-y {
    position: absolute; left: 0; width: 11%; transform: translateY(-50%);
    text-align: right; font-size: 9px; color: var(--text4);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .c-x {
    position: absolute; bottom: -1px; transform: translateX(-50%);
    font-size: 9px; color: var(--text4); white-space: nowrap;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .c-x.first { transform: none; }
  .c-x.last { transform: translateX(-100%); }

  .ranges { display: flex; gap: 5px; margin-top: 6px; }
  .ranges button {
    font: inherit; font-size: 10.5px; padding: 1px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text3); cursor: pointer; line-height: 1.5;
  }
  .ranges button:hover { color: var(--accent); border-color: var(--accent); }
  .ranges button.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .ranges button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  footer { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 12px;
    font-size: 11.5px; color: var(--text3); line-height: 1.8; }
  footer .warn { color: var(--warn); }
  footer .gen { margin-top: 6px; color: var(--text4); }

  @media (max-width: 1080px) {
    .hero { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 680px) {
    body { padding: 18px 10px 36px; }
    .hero { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cards { grid-template-columns: 1fr; gap: 10px; }
    .hero-card output { font-size: 26px; }
    h1 { font-size: 21px; }
  }
  @media print {
    body { background: #fff; }
    .hero-card, .card { break-inside: avoid; }
  }
</style>
</head>

    return `<span class="c-y" style="top:${(y / h * 100).toFixed(1)}%">${fmt(hi - f * span)}</span>`;
  }).join("");
  const xi = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * (hist.length - 1)));
  const xlabs = xi.map((i, k) => {
    const cls = k === 0 ? "c-x first" : k === xi.length - 1 ? "c-x last" : "c-x";
    return `<span class="${cls}" style="left:${(X(i) / w * 100).toFixed(1)}%">${shortDate(hist[i][0])}</span>`;
  }).join("");
  const li = pts.length - 1, mi = vs.indexOf(min), xi2 = vs.indexOf(max);
  let labels = "";
  const lastAbove = pts[li][1] - 10 < 2;
  labels += `<span class="c-lab last" style="${pct(pts[li][0] - 8, lastAbove ? pts[li][1] + 10 : pts[li][1] - 10)}">${fmt(vs[li])}</span>`;
  const far = i => Math.abs(i - li) > hist.length * 0.12;
  const showMin = far(mi) && min >= lo, showMax = far(xi2) && max <= hi;
  if (showMin) labels += `<span class="c-lab" style="${pct(pts[mi][0], Math.min(pts[mi][1] + 9, h - 12))}">${fmt(min)}</span>`;
  if (showMax) labels += `<span class="c-lab" style="${pct(pts[xi2][0], Math.max(pts[xi2][1] - 9, 4))}">${fmt(max)}</span>`;
  return `<div class="chart" style="height:${h}px" role="img" aria-label="历史走势, 区间 ${fmt(min)} 至 ${fmt(max)}">` +
    `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">` +
    `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" class="ga0"/><stop offset="100%" class="ga1"/></linearGradient></defs>` +
    grid +
    `<line class="avg" x1="${padL}" y1="${avgY}" x2="${w}" y2="${avgY}"/>` +
    `<path class="area" d="${area}" fill="url(#${gid})"/>` +
    `<path class="line${thin ? " thin" : ""}" d="${line}"/>` +
    (showMin ? `<circle class="ext" cx="${pts[mi][0].toFixed(1)}" cy="${pts[mi][1].toFixed(1)}" r="2"/>` : "") +
    (showMax ? `<circle class="ext" cx="${pts[xi2][0].toFixed(1)}" cy="${pts[xi2][1].toFixed(1)}" r="2"/>` : "") +
    `<circle class="dot" cx="${pts[li][0].toFixed(1)}" cy="${pts[li][1].toFixed(1)}" r="3"/></svg>` +
    ylabs + labels + xlabs + `</div>`;
}
const RANGE_LBL = { all: "十年", y3: "近三年", y1: "近一年" };
const rangeSel = {};

function sliceHist(hist, r) {
  if (!hist || !hist.length || r === "all") return hist;
  const days = r === "y3" ? 1095 : 365;
  const end = new Date(hist[hist.length - 1][0]).getTime();
  const out = hist.filter(p => new Date(p[0]).getTime() >= end - days * 864e5);
  return out.length >= 2 ? out : hist;
}

/* COT 多交易所净持仓对比图: 多线 + 零轴 + 图例(最新值/周变动) */
const COT_COLORS = { wti_nymex: "#2563eb", brent_ice: "#dc2626", wti_ice: "#d97706" };
function cotHtml(cot, h) {
  if (!cot || !cot.dates || cot.dates.length < 4) return "";
  h = h || 150;
  const sel = rangeSel["_cot"] || "all";
  const days = sel === "y3" ? 1095 : sel === "y1" ? 365 : 0;
  let idx = cot.dates.map((d, i) => i);
  if (days) {
    const end = new Date(cot.dates[cot.dates.length - 1]).getTime();
    idx = idx.filter(i => new Date(cot.dates[i]).getTime() >= end - days * 864e5);
  }
  if (idx.length < 2) idx = cot.dates.map((d, i) => i);
  const w = 200, padL = 26, padR = 5, padT = 8, padB = 15;
  let lo = Infinity, hi = -Infinity;
  const series = cot.series.map(s => {
    const vals = idx.map(i => s.values[i]);
    vals.forEach(v => {
      if (v !== null && v !== undefined) { if (v < lo) lo = v; if (v > hi) hi = v; }
    });
    return Object.assign({}, s, { vals });
  });
  if (!isFinite(lo) || !isFinite(hi)) return "";
  const pad6 = (hi - lo) * 0.08 || 1;
  lo -= pad6; hi += pad6;
  const span = hi - lo || 1;
  const X = j => padL + j * (w - padL - padR) / (idx.length - 1);
  const Y = v => h - padB - (v - lo) / span * (h - padT - padB);
  // 坐标刻度: 4 条横网格 + 左侧数值标签, 5 个底部日期标签
  const tf = [0.15, 0.38, 0.62, 0.85];
  const grid = tf.map(f => {
    const y = (padT + f * (h - padT - padB)).toFixed(1);
    return `<line class="grid" x1="${padL}" y1="${y}" x2="${w}" y2="${y}"/>`;
  }).join("");
  const ylabs = tf.map(f => {
    const y = padT + f * (h - padT - padB);
    return `<span class="c-y" style="top:${(y / h * 100).toFixed(1)}%">${fmt(hi - f * span)}</span>`;
  }).join("");
  const xidx = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * (idx.length - 1)));
  const xlabs = xidx.map((j, k) => {
    const cls = k === 0 ? "c-x first" : k === xidx.length - 1 ? "c-x last" : "c-x";
    return `<span class="${cls}" style="left:${(X(j) / w * 100).toFixed(1)}%">${shortDate(cot.dates[idx[j]])}</span>`;
  }).join("");
  const zero = (lo < 0 && hi > 0)
    ? `<line class="zero" x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${w}" y2="${Y(0).toFixed(1)}"/>` : "";
  let paths = "", dots = "";
  const lastLabels = [];
  series.forEach(s => {
    const color = COT_COLORS[s.key] || "#6b7280";
    const pts = [];
    s.vals.forEach((v, j) => {
      if (v !== null && v !== undefined) pts.push([X(j), Y(v), v]);
    });
    if (pts.length < 2) return;
    paths += `<path d="${smoothPath(pts.map(p => [p[0], p[1]]), padT - 6, h - padB + 4)}" ` +
      `fill="none" stroke="${color}" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = pts[pts.length - 1];
    dots += `<circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="2.6" fill="${color}" stroke="#fff" stroke-width="1.2"/>`;
    lastLabels.push({ y: lp[1], color, txt: fmt(lp[2]) });
  });
  // 右端标注纵向去重叠
  lastLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < lastLabels.length; i++)
    lastLabels[i].y = Math.max(lastLabels[i].y, lastLabels[i - 1].y + 11);
  for (let i = lastLabels.length - 2; i >= 0; i--)
    lastLabels[i].y = Math.min(lastLabels[i].y, lastLabels[i + 1].y - 11);
  const pct = (x, y) => `left:${(x / w * 100).toFixed(1)}%;top:${(y / h * 100).toFixed(1)}%`;
  const labels = lastLabels.map(l =>
    `<span class="c-lab" style="${pct(w - 12, Math.min(Math.max(l.y, 6), h - 4))};color:${l.color};font-weight:650">${l.txt}</span>`
  ).join("");
  const legend = series.map(s => {
    const tail = s.values.filter(v => v !== null && v !== undefined);
    const last = tail[tail.length - 1];
    const color = COT_COLORS[s.key] || "#6b7280";
    const wow = s.wow;
    return `<span class="cot-leg"><i style="background:${color}"></i>${s.label} <b>${fmt(last)}</b> 千手` +
      (wow !== null && wow !== undefined
        ? ` <span style="color:${wow >= 0 ? "var(--up)" : "var(--down)"}">(${(wow > 0 ? "+" : "") + fmt(wow)})</span>`
        : "") + `</span>`;
  }).join("");
  const btns = cot.dates.length > 10
    ? `<div class="ranges" data-ranges="_cot">` +
      Object.keys(RANGE_LBL).map(r =>
        `<button type="button" data-r="${r}" class="${r === sel ? "active" : ""}">${RANGE_LBL[r]}</button>`
      ).join("") + `</div>` : "";
  return `<div class="cot-legend">${legend}</div>` + btns +
    `<div class="chart" style="height:${h}px" role="img" aria-label="各交易所管理基金净多持仓走势">` +
    `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">` +
    grid + zero + paths + dots + `</svg>` + ylabs + labels + xlabs + `</div>`;
}

function cardHtml(m, hero, tall) {
  if (!m) return "";
  const sel = rangeSel[m._key] || "all";
  const hv = sliceHist(m.history, sel);
  const note = EXTRA_LABEL[m._key] ? `<span class="date">${EXTRA_LABEL[m._key]}</span>` : "";
  let rangeTxt = "";
  if (hero && m.history && m.history.length > 1) {
    const vs = m.history.map(p => p[1]);
    rangeTxt = `<span class="range">十年区间 ${fmt(Math.min(...vs))}–${fmt(Math.max(...vs))}</span>`;
  }
  const btns = (m.history && m.history.length > 10)
    ? `<div class="ranges" data-ranges="${m._key}">` +
      Object.keys(RANGE_LBL).map(r =>
        `<button type="button" data-r="${r}" class="${r === sel ? "active" : ""}">${RANGE_LBL[r]}</button>`
      ).join("") + `</div>` : "";
  return `<div class="${hero ? "hero-card" : "card"}">` +
    `<div class="lbl">${m.label}</div>` +
    `<div class="meta"><output>${fmt(m.value)}<span class="unit">${m.unit}</span></output>${chipHtml(m)}</div>` +
    `<div class="meta"><span class="date">${m.date || ""}</span>${rangeTxt}${note}</div>` +
    btns + chartHtml(hv, hero, hero ? 110 : tall ? 130 : undefined, THIN_LINES[m._key],
                     m._key === "signal_score" ? [-100, 100] : null) + `</div>`;
}

function renderAll() {
  const M = DATA.metrics || {};
  Object.keys(M).forEach(k => M[k]._key = k);
  document.getElementById("asof").textContent = `数据截至 ${DATA.as_of}`;
  const sig = DATA.signal, sigEl = document.getElementById("sig");
  if (sig) {
    sigEl.hidden = false;
    sigEl.className = "sig sig-" + sig.cls;
    sigEl.textContent = `供求信号: ${sig.label} ${sig.score > 0 ? "+" : ""}${sig.score}`;
    sigEl.title = sig.text || "";
  }
  const items = DATA.summary || [];
  document.getElementById("brief").innerHTML = items.length
    ? `<h2>本周供求解读</h2><ul>` +
      items.map(s => `<li><b>${s.t}</b>${s.x}</li>`).join("") + `</ul>`
    : "";
  document.getElementById("brief").style.display = items.length ? "" : "none";
  document.getElementById("hero").innerHTML = HERO_KEYS.map(k => cardHtml(M[k], true)).join("");
  document.getElementById("body-sections").innerHTML = SECTION_ORDER.map(sk => {
    const sec = (DATA.sections || {})[sk];
    if (!sec) return "";
    if (sk === "cot") {
      const html = cotHtml(DATA.cot);
      return html
        ? `<section><h2>${sec.title}<span class="src">${SECTION_SRC[sk] || ""}</span></h2>${html}</section>`
        : "";
    }
    const keys = sec.keys.filter(k => !HERO_KEYS.includes(k));
    if (!keys.length) return "";
    const big = sk === "us_stocks" || sk === "china";
    const wide = sk === "signal";
    const cols = wide ? "wide" : keys.length === 1 ? "n1" : keys.length === 2 ? "n2" : "";
    return `<section><h2>${sec.title}<span class="src">${SECTION_SRC[sk] || ""}</span></h2>` +
      `<div class="cards ${cols} ${big ? "big" : ""}">` +
      keys.map(k => cardHtml(M[k], false, big || wide)).join("") + `</div></section>`;
  }).join("");
  const warns = (DATA.notes || []).map(n => `<div class="warn">⚠ ${n}</div>`).join("");
  document.getElementById("footer").innerHTML =
    warns + (DATA.sources || []).map(s => `<div>${s}</div>`).join("") +
    `<div>本页面数据仅供参考,不构成投资建议。</div>` +
    `<div class="gen">生成时间 2026-08-18 12:29(Asia/Shanghai)</div>`;
}
renderAll();
document.addEventListener("click", e => {
  const b = e.target && e.target.closest ? e.target.closest("button[data-r]") : null;
  if (!b) return;
  rangeSel[b.parentElement.dataset.ranges] = b.dataset.r;
  renderAll();
});
</script>
</body>
